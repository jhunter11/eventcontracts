[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "event-contracts"
version = "0.1.0"
description = "Research and execution framework for Kalshi and Polymarket event contracts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "QWS" }]
# Runtime dependencies are tracked in requirements.txt.
# Dev dependencies are tracked in requirements-dev.txt.
dependencies = []

[project.scripts]
eventcontracts = "eventcontracts.cli:main"

[project.entry-points."eventcontracts.strategies"]
example_threshold = "eventcontracts.plugins.strategies.example_threshold"

[tool.hatch.build.targets.wheel]
packages = ["src/eventcontracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP042 wants `StrEnum` instead of `(str, Enum)`. We intentionally use the
# latter so `str(MyEnum.VALUE)` returns `"MyEnum.VALUE"` rather than `"value"`;
# canonical serialization always goes through `.value`, but human-readable
# logging/repr is more useful with the qualified name.
ignore = ["UP042"]

[tool.ruff.lint.isort]
known-first-party = ["eventcontracts", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/eventcontracts", "tests"]
