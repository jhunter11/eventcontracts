[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "event-contracts"
version = "0.1.0"
description = "Research and execution framework for Kalshi and Polymarket event contracts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "QWS" }]
# Runtime dependencies are tracked in requirements.txt.
# Dev dependencies are tracked in requirements-dev.txt.
dependencies = []

[project.scripts]
eventcontracts = "eventcontracts.cli:main"
ec = "eventcontracts.cli:main"

[project.entry-points."eventcontracts.strategies"]
example_threshold = "eventcontracts.plugins.strategies.example_threshold"

[tool.hatch.build.targets.wheel]
packages = ["src/eventcontracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP042 wants `StrEnum` instead of `(str, Enum)`. We intentionally use the
# latter so `str(MyEnum.VALUE)` returns `"MyEnum.VALUE"` rather than `"value"`;
# canonical serialization always goes through `.value`, but human-readable
# logging/repr is more useful with the qualified name.
ignore = ["UP042"]

[tool.ruff.lint.isort]
known-first-party = ["eventcontracts", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/eventcontracts", "tests"]
# Third-party deps (pyarrow / polars / duckdb) lack type stubs in our env.
# Globally ignore missing imports — `strict = true` still enforces our own
# code, but unwrapped third-party imports won't error. Per-module overrides
# didn't suppress the `import-untyped` / `import-not-found` codes from
# mypy 1.x's strict mode reliably.
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyarrow / duckdb / polars now ship a partial `py.typed`, so strict mode's
# `disallow_untyped_calls` flags every call into them even though the call sites
# are correct. They are untyped C-extension boundaries (the code already casts
# `pa`/`pq` to Any by hand). Treat them as Any so our own strictness is
# preserved without spurious `no-untyped-call` noise on third-party calls.
module = ["pyarrow.*", "duckdb.*", "polars.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
