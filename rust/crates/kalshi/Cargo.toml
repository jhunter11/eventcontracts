[package]
name = "eventcontracts-kalshi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
eventcontracts-contracts = { path = "../contracts" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
url = "2"

rsa = { version = "0.9", default-features = false, features = ["pem", "sha2", "std"] }
sha2 = "0.10"
base64 = "0.22"

time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing", "macros"] }

[lib]
path = "src/lib.rs"
