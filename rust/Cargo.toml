# Rust workspace for low-latency runtime scaffolds.
#
# The cross-language contract is file formats under ../contracts/, not Python
# imports. Runtime crates should preserve externally visible decimals,
# timestamps, IDs, and checksums exactly until parity tests prove parsing
# behavior.

[workspace]
resolver = "2"
members = [
    "crates/allocator",
    "crates/bus",
    "crates/contracts",
    "crates/feature-builder",
    "crates/gateway",
    "crates/kalshi",
    "crates/live-runner",
    "crates/oms",
    "crates/parity",
    "crates/risk",
    "crates/runner",
]

[workspace.package]
edition = "2021"
license = "Proprietary"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
