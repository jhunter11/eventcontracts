# Rust workspace for low-latency runtime scaffolds.
#
# The cross-language contract is file formats under ../contracts/, not Python
# imports. Runtime crates should preserve externally visible decimals,
# timestamps, IDs, and checksums exactly until parity tests prove parsing
# behavior.

[workspace]
resolver = "2"
members = [
    "crates/contracts",
    "crates/feature-builder",
    "crates/gateway",
    "crates/kalshi",
    "crates/live-runner",
    "crates/model-runtime",
    "crates/oms",
    "crates/parity",
    "crates/risk",
    "crates/runner",
    "crates/runtime-hot",
]

[workspace.package]
edition = "2021"
license = "Proprietary"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "1"
smol_str = { version = "0.2", features = ["serde"] }
arrayvec = { version = "0.7", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
sha2 = "0.10"
criterion = "0.5"
async-trait = "0.1"
