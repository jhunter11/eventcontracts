strategy_id = "sports-player_cut_lgbm-v1"
name = "sports_player_cut_lgbm"
version = "1.0.0"
description = "Player-level cut predictor exploiting SG approach vs putting mean reversion."
feature_schema_id = "sports_player_cut_features"

[subscription]
venues = ["kalshi"]
instrument_patterns = ["KX-PGA-*-CUT", "*-CUT-*"]
event_kinds = ["external", "timer", "quote"]
external_sources = ["datagolf", "pga-tour"]

[default_execution_priority]
tier = "relaxed"
reason = "edge has a long realization window (round 2 close)"

[parameters]
# Operator-supplied roster: semicolon-separated `player_id:market_id` pairs.
# Empty by default so the strategy loads without forcing a hard-coded roster.
player_market_map = ""
signal_source = "datagolf"
timer_label = "player_round_complete"
min_edge_bps = "100"
kelly_fraction = "0.05"
max_size = "25"
mean_reversion_weight = "0.08"
cash_fallback_usd = "1000"
venue = "kalshi"
feature_schema_version = "v1"

[tags]
family = "sports"
mode = "paper"
research_doc = "docs/golf-strategy-specs.md#1"
