strategy_id = "weather-temperature_arbitrage-v1"
name = "weather_temperature_arbitrage"
version = "1.0.0"
description = "Rules-mode Kalshi temperature bracket arbitrage using point-in-time weather forecast probabilities."
feature_schema_id = "weather_temperature_arbitrage_features"

[subscription]
venues = ["kalshi"]
instrument_patterns = ["KXHIGH*", "KXTEMP*", "WX-*"]
event_kinds = ["quote", "external"]
external_sources = ["open-meteo", "noaa-hrrr"]

[default_execution_priority]
tier = "standard"
max_delay_ms = 1000
expires_after_ms = 300000
reason = "weather signal half-life is minutes, not milliseconds"

[parameters]
min_edge_bps = "150"
max_size = "5000"
order_ttl_ms = 5000
kelly_fraction = "1.00"
currency = "USD"
capital_source = "context_cash"
capital_base = "0"
allow_static_capital_base = false
max_trade_capital_fraction = "0.50"
max_ladder_capital_fraction = "1.00"
max_active_capital_fraction = "1.00"
signal_source = "open-meteo"
execution_mode = "taker_if_edge"
quote_triggered_trading = true
max_signal_age_seconds = 180
# 0 = off (paper logs every bracket incl. final minutes); the live sleeve sets a buffer.
min_seconds_to_close = "0"
max_spread = "0.80"
spread_edge_multiplier = "0.10"
near_binary_price = "0.95"
near_binary_min_edge_bps = "600"
max_ladder_notional = "10000"
max_ladder_orders = 80
max_ticker_orders = 6
min_retrade_price_delta = "0.03"
min_retrade_probability_delta = "0.04"

[tags]
family = "weather"
mode = "paper"
research_doc = "docs/v7-live-test-ready-strategy-specs.md"
