strategy_id = "court-docket_timing-v1"
name = "court_docket_timing"
version = "1.0.0"
description = "Rules-mode docket timing edge for legal and regulatory event markets."
feature_schema_id = "court_docket_timing_features"

[subscription]
venues = ["kalshi"]
instrument_patterns = ["KXCOURT*", "KXLEGAL*", "KXREG*"]
event_kinds = ["quote", "external"]
external_sources = ["court-docket"]

[default_execution_priority]
tier = "relaxed"
max_delay_ms = 5000
expires_after_ms = 3600000
reason = "docket timing signals are slow-moving"

[parameters]
signal_source = "court-docket"
min_edge_bps = "110"
min_docket_intensity = "0.5"
size = "4"
venue = "kalshi"

[tags]
family = "legal"
mode = "paper"
research_doc = "docs/strategy-specs.md"
